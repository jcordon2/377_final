<!DOCTYPE html>
<html>
    <head>
        <title> User-Mood </title>
        <link rel = "stylesheet" href = "style.css">
        <script defer src = "mewd.js"></script>
    </head>

    <body>
        <center>
        <div class = "vertical-stack">
        <h1> How do you feel rn? </h1>

        <button onclick = "chooseMood('happy')"> :D </button>
        <img src = "https://i.pinimg.com/webp85/736x/2f/23/8a/2f238a01ab772cbe9995d79cb27f07d5.webp" width = "120" height = "80" class = "img">
        <button onclick = "chooseMood('sad')"> :'( </button>
        <img src = "https://i.pinimg.com/736x/64/9a/e0/649ae08a959760aec3d78e6838745777.jpg" width = "120" height = "80" class = "img">
        <button onclick = "chooseMood('calm')"> chill </button>
        <img src = "https://i.pinimg.com/736x/01/73/d1/0173d1902e8e883b492eba4a4efff93b.jpg" width = "120" height = "80" class = "img">
        <button onclick = "chooseMood('angry')"> >:( </button>
        <img src = "https://i.pinimg.com/webp85/736x/92/85/9b/92859ba3c83ffecf1d782abee3882570.webp" width = "120" height = "80" class = "img">
        <button onclick = "chooseMood('romantic')"> Romantical </button>
        <img src = "https://i.pinimg.com/736x/88/21/4c/88214c4caea9204b058acafa8a4f6971.jpg" width = "120" height = "80" class = "img">
        <button onclick = "chooseMood('cozy')"> Soft n' Cozy </button>
        <img src = "https://i.pinimg.com/736x/92/3b/38/923b386d5105a394794edd139c65a1ff.jpg" width = "120" height = "80" class = "img">
        <button onclick = "chooseMood('adrenaline')"> Scary ! </button>
        <img src = "https://i.pinimg.com/webp85/736x/9e/c8/02/9ec80287a40827163e5c598eb1a1ba23.webp" width = "120" height = "80" class = "img">

        </div>
        </center>
    </body>
</html>
